# Listen on all interfaces so the ESP32 can reach the broker over the LAN.
# (Mosquitto 2.x only accepts localhost connections unless a listener is set.)
listener 1883

# Development setup on a trusted home network. Add a password_file
# before exposing the broker outside the LAN.
allow_anonymous true

# Keep retained messages (device online/offline status) across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
